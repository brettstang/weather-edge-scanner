# Temporary diagnostics (will be removed)
name: Probe HKO
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for k in high low; do
            curl -s --max-time 70 "https://weather-edge-scanner.vercel.app/api/scan?kind=$k&near=1" > $k.json
            node -e '
              const o = require("./'$k'.json");
              console.log("RESULT", "'$k'", "partial", o.partial, "hits", (o.hits||[]).length, "overview", (o.overview||[]).length, "noSmartOverview", (o.overview||[]).filter(r=>r.forecast!=null&&!r.smart).length);
              for (const h of o.hits||[]) console.log("RESULT", "'$k'", h.city, h.date, h.hit||h.type||"", "smart", h.smart ? h.smart.value : "MISSING", h.smart && h.smart.fallback ? "fallback:"+h.smart.reason : "");
              for (const r of (o.overview||[]).filter(r=>r.forecast!=null&&!r.smart).slice(0,15)) console.log("RESULT", "'$k'", "ov-nosmart", r.city, r.date, r.station);
            '
          done
