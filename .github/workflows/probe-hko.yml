# Temporary: check METAR history depth for a few airports (will be removed)
name: Probe HKO
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in KDEN MMMX OEJN LTAC NZWN KORD; do
            curl -sS --max-time 30 "https://aviationweather.gov/api/data/metar?ids=$id&format=json&hours=168" > m.json
            echo "$id total=$(jq length m.json) routine=$(jq '[.[]|select(.metarType=="METAR")]|length' m.json) speci=$(jq '[.[]|select(.metarType=="SPECI")]|length' m.json) oldest=$(jq -r '[.[].reportTime]|min' m.json) newest=$(jq -r '[.[].reportTime]|max' m.json) withRMK_T=$(jq '[.[]|select(.rawOb|test(" RMK .* T[01][0-9]{3}"))]|length' m.json) types=$(jq -c '[.[].metarType]|unique' m.json)"
          done
          echo "sample:"; jq -c '.[0] | {metarType, reportTime, obsTime, temp, rawOb}' m.json
