<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather Scanner">
<meta name="theme-color" content="#0b1026">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="/icon.png?v=2">
<title>Weather Scanner</title>
<style>
  :root {
    --bg1:#0b1026; --bg2:#1b1f4a; --bg3:#2a1d4f;
    --glass: rgba(255,255,255,.07); --glass-2: rgba(255,255,255,.12); --stroke: rgba(255,255,255,.10);
    --text:#f4f6ff; --muted:rgba(235,238,255,.62); --faint:rgba(235,238,255,.38);
    --cold:#5ec8ff; --cold-2:#3a7bff; --hot:#ff9f43; --hot-2:#ff5e62; --green:#3ee6a0; --amber:#ffd166;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg1); }
  body {
    margin:0; min-height:100vh; color:var(--text);
    font-family:-apple-system, "SF Pro Display", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 48px);
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(255,140,90,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(80,160,255,.20), transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%); }
  .wrap { max-width:560px; margin:0 auto; }

  /* Header */
  header { display:flex; align-items:center; justify-content:space-between; margin:6px 2px 4px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--cold-2),#8a5cff 55%,var(--hot-2));
          display:grid; place-items:center; box-shadow:0 6px 20px rgba(120,90,255,.35); font-size:22px; }
  h1 { font-size:24px; font-weight:800; letter-spacing:-.5px; margin:0; white-space:nowrap; }
  .sub { color:var(--muted); font-size:13px; margin-top:1px; }
  .share { flex:none; display:flex; align-items:center; gap:6px; border:1px solid var(--stroke); background:var(--glass);
           color:var(--text); font:600 14px -apple-system, system-ui, sans-serif; padding:9px 14px; border-radius:999px; cursor:pointer;
           -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  .share:active { transform:scale(.96); }
  @media (max-width: 420px) { .share-lbl { display:none; } .share { padding:11px; } .share svg { width:18px; height:18px; } }
  .share svg { width:16px; height:16px; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translate(-50%, 20px); opacity:0;
           background:rgba(20,22,40,.92); border:1px solid var(--stroke); color:var(--text); padding:12px 18px; border-radius:999px;
           font-size:14px; transition:.25s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }

  /* Controls */
  .controls { margin:22px 0 12px; display:flex; flex-direction:column; gap:14px; }
  .scan {
    position:relative; width:100%; border:0; border-radius:20px; padding:18px; cursor:pointer;
    font:700 19px/1 -apple-system, system-ui, sans-serif; color:#fff; letter-spacing:.2px;
    background:linear-gradient(135deg,#3a7bff 0%,#7b5cff 50%,#ff6a7a 100%);
    box-shadow:0 10px 30px rgba(110,90,255,.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s ease, filter .2s;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .scan:active { transform:scale(.98); }
  .scan:disabled { filter:saturate(.5) brightness(.85); }
  .btns { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .btns .scan { flex-direction:row; gap:8px; font-size:16px; padding:16px 8px; border-radius:18px; }
  .btns .scan .ico { font-size:24px; line-height:1; }
  .btns .scan.busy .ico { display:none; }
  .btns .scan .spinner { width:22px; height:22px; }
  .scan.sun { background:linear-gradient(135deg,#ff9f1c 0%,#ffbf3c 50%,#ffd86b 100%); color:#3a2300; box-shadow:0 10px 30px rgba(255,170,40,.4), inset 0 1px 0 rgba(255,255,255,.35); }
  .scan.sun .spinner { border-color:rgba(58,35,0,.25); border-top-color:#3a2300; }
  .card.SUN::before { background:linear-gradient(#ffd86b,#ff9f1c); }
  .badge.SUN { background:rgba(255,200,80,.16); color:#ffd27a; }
  .clouds { display:grid; grid-template-columns:repeat(24,1fr); align-items:end; gap:2px; height:32px; margin:6px 0 4px; }
  .xcheck { width:100%; margin:12px 0 12px; padding:12px; border-radius:14px; border:1px solid var(--stroke); cursor:pointer;
            background:rgba(255,255,255,.08); color:var(--text); font:600 15px -apple-system, system-ui, sans-serif;
            display:flex; align-items:center; justify-content:center; gap:8px; }
  .xcheck:active { transform:scale(.98); }
  .xcheck .spinner { width:16px; height:16px; }
  .xcheck.busy .spinner { display:block; }
  .xres { display:grid; gap:8px; margin:-2px 0 12px; }
  .xres:empty { display:none; }
  .xr { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid var(--stroke); }
  .xr .ic { font-size:20px; line-height:1.2; }
  .xr .nm { font-weight:700; font-size:15px; display:flex; gap:8px; align-items:center; }
  .xr .dt { color:var(--muted); font-size:13px; margin-top:2px; line-height:1.4; }
  .pill { font-size:11px; font-weight:800; letter-spacing:.4px; padding:3px 8px; border-radius:999px; }
  .pill.pass { background:rgba(62,230,160,.16); color:var(--green); }
  .pill.fail { background:rgba(255,94,98,.16); color:#ff9b9e; }
  .pill.near { background:rgba(255,209,102,.16); color:var(--amber); }
  .pill.na { background:rgba(255,255,255,.1); color:var(--muted); }
  .xr.pass { border-color:rgba(62,230,160,.35); }
  .models { margin:4px 0 12px; border:1px solid var(--stroke); border-radius:14px; overflow:hidden; }
  .models .mh { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:rgba(255,255,255,.06); font-weight:700; font-size:14px; }
  .models .mh .agree { font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; }
  .agree.strong { background:rgba(62,230,160,.16); color:var(--green); }
  .agree.mixed { background:rgba(255,209,102,.16); color:var(--amber); }
  .agree.weak { background:rgba(255,94,98,.16); color:#ff9b9e; }
  .models .mr { display:flex; justify-content:space-between; padding:7px 12px; font-size:14px; border-top:1px solid var(--stroke); }
  .models .mr span:first-child { color:var(--muted); }
  .models .mr.in b { color:var(--green); } .models .mr.out b { color:#ff9b9e; }
  .links { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .links a { flex:1 1 auto; text-align:center; text-decoration:none; color:#fff; font-size:13px; font-weight:600; padding:9px 10px;
             border-radius:12px; background:rgba(255,255,255,.08); border:1px solid var(--stroke); white-space:nowrap; }
  .row.tap { cursor:pointer; }
  .row.tap .chev { font-style:normal; display:inline-block; margin-left:6px; font-size:18px; color:var(--muted); transition:transform .2s; }
  .row.tap.open .chev { transform:rotate(90deg); }
  .row .detail { margin:6px -4px 12px; cursor:default; }
  .row .detail .card { margin:0; }
  .row .detail .loading { text-align:center; color:var(--muted); padding:16px; font-size:14px; }
  .obs { display:flex; gap:8px; align-items:flex-start; margin:10px 0 2px; padding:9px 12px; border-radius:12px;
         background:rgba(94,200,255,.08); border:1px solid rgba(94,200,255,.25); font-size:13px; line-height:1.4; color:#cfe9ff; }
  .obs b { color:#fff; }
  .badge.LOCK { background:rgba(62,230,160,.18); color:var(--green); }
  .badge.LOCK.HIGH { background:rgba(255,77,82,.2); color:#ff7a7e; }
  .badge.LOCK.LOW { background:rgba(45,105,255,.26); color:#7fa6ff; }
  .lt { display:inline-block; max-width:100%; margin-top:6px; padding:4px 10px; border-radius:999px; font-size:12px;
        background:rgba(255,255,255,.08); color:#dfe4ff; border:1px solid var(--stroke); font-variant-numeric:tabular-nums; }
  .row .lt { margin:4px 0 0; padding:2px 8px; font-size:11px; }
  .gbtn { width:100%; margin:0 0 12px; padding:11px; border-radius:14px; border:1px solid var(--stroke); cursor:pointer;
          background:rgba(255,255,255,.08); color:var(--text); font:600 15px -apple-system, system-ui, sans-serif; }
  .gbtn.open { background:rgba(94,200,255,.14); border-color:rgba(94,200,255,.35); }
  .gbox:empty { display:none; }
  .gbox { margin:-4px 0 12px; padding:10px 8px 8px; border-radius:14px; background:rgba(0,0,0,.18); border:1px solid var(--stroke); }
  .gbox svg { width:100%; height:auto; display:block; }
  .gleg { display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; font-size:12px; color:var(--muted); margin-top:6px; }
  .gleg i { display:inline-block; width:16px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  .gleg2 { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; margin-top:8px; }
  .gleg2 .li { display:flex; align-items:center; gap:6px; border:0; background:rgba(255,255,255,.05); border-radius:8px; padding:5px 7px;
               color:var(--text); font:500 12px -apple-system, system-ui, sans-serif; text-align:left; cursor:pointer; min-width:0; }
  .gleg2 .li i { flex:none; width:14px; height:4px; border-radius:2px; }
  .gleg2 .li span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gleg2 .li b { flex:none; font-weight:700; font-size:11.5px; color:#dfe4ff; font-variant-numeric:tabular-nums; }
  .gleg2 .li.sel { background:rgba(255,255,255,.18); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55); }
  .gleg2 .li.dim { opacity:.45; }
  .readout { margin:8px 2px 0; padding:9px 11px; border-radius:10px; background:rgba(255,255,255,.06); font-size:13px; color:#dfe4ff; min-height:20px; }
  .readout .rbig { font-size:20px; font-weight:800; color:#fff; margin-left:2px; }
  .readout .rdot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .readout .rhead { font-weight:700; margin-bottom:6px; }
  .readout .rgrid { display:grid; grid-template-columns:1fr auto 1fr auto; gap:3px 10px; font-size:12.5px; }
  .readout .rgrid b { text-align:right; font-variant-numeric:tabular-nums; }
  .readout small { color:var(--faint); }
  .grange { display:block; width:100%; margin:10px 0 0; padding:10px; border-radius:12px; border:1px solid var(--stroke); cursor:pointer;
            background:rgba(255,255,255,.08); color:var(--text); font:600 14px -apple-system, system-ui, sans-serif; }
  .gleg2 .li small.miss { display:block; font-size:10.5px; color:var(--faint); font-weight:600; margin-top:1px; }
  .gleg2 .li small.miss.best { color:var(--green); }
  .gbox { position:relative; }
  .gexp { position:absolute; top:6px; right:6px; z-index:2; border:1px solid var(--stroke); background:rgba(20,22,43,.8); color:#fff;
          font:600 12px -apple-system, system-ui, sans-serif; padding:5px 9px; border-radius:999px; cursor:pointer; }
  .gbox .gsum { padding:0 70px; }
  body.fs-open { overflow:hidden; }
  .fs { position:fixed; inset:0; z-index:1000; background:#0b1026; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .fs .fsbox { flex:none; margin:0; border:0; border-radius:0; padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px);
               background:linear-gradient(180deg,#0b1026,#1b1f4a); box-sizing:border-box; }
  .fs.rot .fsbox { transform:rotate(90deg); padding:12px 16px; }
  .fsl { display:flex; gap:14px; height:100%; }
  .fsc { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .fsc .gsum { padding:0 36px 0 0; text-align:left; }
  .fsc svg { max-height:calc(100% - 28px); }
  .fsp { width:min(260px, 34%); flex:none; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px; }
  .fsp .gleg2 { grid-template-columns:1fr 1fr; }
  .fsp .readout { margin-top:0; }
  .fsp { padding-top:44px; }
  .fsp .mw { display:none; }
  .fsx { position:absolute; top:10px; right:12px; z-index:3; width:34px; height:34px; border-radius:50%; border:1px solid var(--stroke);
         background:rgba(255,255,255,.12); color:#fff; font-size:16px; cursor:pointer; }
  .fs:not(.rot) .fsx { top:calc(env(safe-area-inset-top) + 8px); right:calc(env(safe-area-inset-right) + 10px); }
  .glh { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:10px 2px 2px; }
  .gtip { text-align:center; font-size:11px; color:var(--faint); margin-top:8px; }
  .gsum { text-align:center; font-size:13px; color:#dfe4ff; margin:2px 0 6px; }
  .cap { font-size:12px; color:var(--faint); margin-top:12px; }
  details.hours { margin:10px 0 2px; }
  details.hours summary { background:rgba(255,255,255,.06); padding:10px 14px; border-radius:12px; font-size:14px; }
  details.hours summary::after { font-size:18px; }
  .hgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .hgrid div { border-radius:10px; padding:7px 4px; text-align:center; background:rgba(255,255,255,.06); line-height:1.25; }
  .hgrid div small { display:block; font-size:11px; color:var(--muted); }
  .hgrid div b { font-size:15px; }
  .hgrid div.sunny { background:rgba(255,200,80,.18); } .hgrid div.sunny b { color:#ffd27a; }
  .hgrid div.cloudy b { color:#e6e9ff; }
  .hgrid div.night { opacity:.45; }
  .clouds i { border-radius:3px 3px 1px 1px; min-height:4px; background:rgba(255,255,255,.55); }
  .clouds i.sunny { background:linear-gradient(#ffd86b,#ff9f1c); }
  .clouds i.dark { background:rgba(255,255,255,.08); }
  .row .clouds { height:26px; margin:10px 0 4px; }
  .scan.night { background:linear-gradient(135deg,#3b2a8f 0%,#6a3df0 55%,#c86dd7 100%); box-shadow:0 10px 30px rgba(106,61,240,.4), inset 0 1px 0 rgba(255,255,255,.25); }
  .card.NIGHT::before { background:linear-gradient(#c86dd7,#6a3df0); }
  .badge.NIGHT { background:rgba(160,120,255,.18); color:#cdb6ff; }
  .spark { display:grid; grid-template-columns:repeat(24,1fr); align-items:end; gap:2px; height:64px; margin:14px 0 4px; }
  .spark i { border-radius:3px 3px 1px 1px; background:rgba(255,255,255,.22); min-height:3px; }
  .spark i.nt { background:rgba(160,120,255,.55); }
  .spark i.pk { background:linear-gradient(#ffd166,#ff9f43); box-shadow:0 0 10px rgba(255,180,80,.6); }
  .row .spark { height:34px; margin:10px 0 4px; }
  .scan.rain { background:linear-gradient(135deg,#1fa2ff 0%,#12d8fa 55%,#3ee6a0 100%); box-shadow:0 10px 30px rgba(18,180,250,.35), inset 0 1px 0 rgba(255,255,255,.25); }
  .card.RAIN::before { background:linear-gradient(#12d8fa,#1fa2ff); }
  .badge.RAIN { background:rgba(18,216,250,.15); color:#7fe7ff; }
  .strip { display:grid; grid-template-columns:repeat(24,1fr); gap:2px; margin:14px 0 4px; }
  .strip i { height:16px; border-radius:3px; background:rgba(255,255,255,.08); }
  .strip i.on { background:linear-gradient(#5ec8ff,#1fa2ff); box-shadow:0 0 8px rgba(30,160,255,.5); }
  .strip i.run { background:linear-gradient(#7fe7ff,#12d8fa); }
  .strip-labels { display:flex; justify-content:space-between; font-size:11px; color:var(--faint); margin-bottom:12px; }
  .row .strip { margin:10px 0 4px; } .row .strip i { height:10px; }
  .spinner { width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff;
             animation:spin .8s linear infinite; display:none; }
  .scan.busy .spinner { display:block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .toggle { display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
            background:var(--glass); border:1px solid var(--stroke); border-radius:16px;
            -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  .toggle span { font-size:15px; } .toggle small { display:block; color:var(--faint); font-size:12px; margin-top:2px; }
  .slider input[type=range] { width:100%; margin:12px 0 2px; -webkit-appearance:none; appearance:none; height:6px; border-radius:6px;
    background:linear-gradient(90deg,#ffd86b var(--fill,20%),rgba(255,255,255,.15) var(--fill,20%)); outline:none; }
  .slider input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .slider b { color:#ffd27a; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:18px 0 0; padding:4px; border-radius:16px;
          background:rgba(255,255,255,.07); border:1px solid var(--stroke); }
  .tab { border:0; background:none; color:var(--muted); font:700 15px -apple-system, system-ui, sans-serif; padding:11px 6px; border-radius:12px; cursor:pointer; }
  .tab.on { background:rgba(255,255,255,.16); color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  body.low .tab.on[data-kind="low"] { background:linear-gradient(135deg,rgba(94,200,255,.35),rgba(58,123,255,.35)); }
  body:not(.low) .tab.on[data-kind="high"] { background:linear-gradient(135deg,rgba(255,159,67,.35),rgba(255,94,98,.3)); }
  .autobar[hidden] { display:none; }
  .autobar { display:flex; justify-content:space-between; align-items:center; margin:-6px 4px 0; font-size:12px; color:var(--faint); }
  .autobar button { border:0; background:none; color:#7fb2ff; font:600 13px -apple-system, system-ui, sans-serif; padding:4px 0; cursor:pointer; }
  .switch { position:relative; width:51px; height:31px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch i { position:absolute; inset:0; border-radius:31px; background:rgba(255,255,255,.18); transition:.25s; }
  .switch i::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff;
                     box-shadow:0 2px 6px rgba(0,0,0,.3); transition:.25s; }
  .switch input:checked + i { background:var(--green); }
  .switch input:checked + i::after { transform:translateX(20px); }

  /* Stats */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0 6px; }
  .stat { background:var(--glass); border:1px solid var(--stroke); border-radius:16px; padding:12px 12px 10px;
          -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  .stat b { display:block; font-size:24px; font-weight:800; letter-spacing:-.5px; }
  .stat span { color:var(--muted); font-size:12px; }
  .stat.hit b { color:var(--green); } .stat.near b { color:var(--amber); }
  button.stat { font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .stat.tap small { display:block; font-size:11px; color:var(--faint); margin-top:4px; }
  .stat.tap:not([disabled]) small { color:#9fc4ff; }
  .stat.tap.on { background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4); }
  .stat.tap[disabled] { cursor:default; opacity:.7; }
  .hsec { scroll-margin-top:12px; }
  .when { color:var(--faint); font-size:12px; text-align:center; margin:8px 0 2px; }

  .section { color:var(--muted); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; margin:24px 4px 10px; }

  /* Cards */
  .card { position:relative; overflow:hidden; background:var(--glass); border:1px solid var(--stroke); border-radius:22px;
          padding:16px 16px 14px; margin:0 0 12px; -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);
          animation:rise .35s ease both; }
  .card::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; }
  /* Edge colours: high hit = red, near high = orange, low hit = dark blue, near low = very light blue */
  .card.HIGH::before { background:linear-gradient(#ff5a5f,#e0262d); }
  .card.HIGH.near::before { background:linear-gradient(#ffb066,#ff8a1f); }
  .card.LOW::before { background:linear-gradient(#3d7bff,#1f4fd1); }
  .card.LOW.near::before { background:linear-gradient(#e3f4ff,#b9e2ff); }
  .card.near { opacity:.92; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .top > div:first-child { flex:1; min-width:0; }
  .city { font-size:22px; font-weight:800; letter-spacing:-.4px; }
  .date { color:var(--muted); font-size:14px; margin-top:2px; }
  .badge { flex:none; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; letter-spacing:.3px; }
  .badge.HIGH { background:rgba(255,77,82,.2); color:#ff7a7e; }
  .badge.nearHIGH { background:rgba(255,145,40,.18); color:#ffab5c; }
  .badge.LOW { background:rgba(45,105,255,.26); color:#7fa6ff; }
  .badge.nearLOW { background:rgba(200,235,255,.16); color:#d9f1ff; }
  .badge.nearb { background:rgba(255,209,102,.15); color:var(--amber); }

  .nums { display:flex; align-items:flex-end; justify-content:space-between; margin:14px 0 6px; }
  .temp { font-size:46px; font-weight:300; letter-spacing:-2px; line-height:1; }
  .temp small { font-size:13px; color:var(--muted); letter-spacing:0; display:block; font-weight:500; margin-bottom:4px; }
  .odds { text-align:right; }
  .odds small { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  .odds b { font-size:30px; font-weight:800; letter-spacing:-1px; }
  .odds .no { font-size:13px; color:var(--faint); }

  /* Temperature bar */
  .bar { position:relative; height:10px; border-radius:10px; margin:14px 0 26px;
         background:linear-gradient(90deg, rgba(94,200,255,.85), rgba(255,255,255,.15) 30%, rgba(255,255,255,.15) 70%, rgba(255,120,80,.9)); }
  .bar .tick { position:absolute; top:-4px; width:2px; height:18px; background:rgba(255,255,255,.75); border-radius:2px; }
  .bar .tick em { position:absolute; top:22px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; color:var(--muted); white-space:nowrap; }
  .bar .dot { position:absolute; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:#fff;
              box-shadow:0 0 0 4px rgba(255,255,255,.18), 0 0 16px rgba(255,255,255,.7); }

  .meta { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--muted);
          border-top:1px solid var(--stroke); padding-top:12px; }
  .meta a { color:#fff; text-decoration:none; font-weight:600; background:var(--glass-2); padding:7px 12px; border-radius:999px; white-space:nowrap; }

  /* All markets */
  details { margin-top:6px; }
  summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
            background:var(--glass); border:1px solid var(--stroke); border-radius:16px; padding:14px 16px; font-weight:600; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"›"; font-size:22px; color:var(--muted); transition:.2s; }
  details[open] summary::after { transform:rotate(90deg); }
  .row { padding:14px 4px 4px; border-bottom:1px solid var(--stroke); }
  .row:last-child { border-bottom:0; }
  .row .rtop { display:flex; justify-content:space-between; align-items:baseline; }
  .row .rtop b { font-size:16px; } .row .rtop span { color:var(--muted); font-size:13px; }
  .row .bar { margin:12px 0 22px; height:8px; }
  .row .bar .tick em { display:none; }
  .row .edges { margin-top:-10px !important; }
  .row .bar .dot { width:14px; height:14px; margin:-7px 0 0 -7px; }
  .row .edges { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:-12px; padding-bottom:8px; }

  .empty { text-align:center; padding:28px 16px; color:var(--muted); }
  .empty div { font-size:40px; margin-bottom:6px; }
  .skip { color:var(--faint); font-size:13px; padding:10px 4px 0; }
  .error { background:rgba(255,94,98,.14); border:1px solid rgba(255,94,98,.35); color:#ffb3b5; border-radius:16px; padding:14px; }
  /* Nurse mascot */
  .logo.nurse { background:none; padding:0; overflow:hidden; box-shadow:0 6px 20px rgba(255,160,60,.35), 0 0 0 2px rgba(255,255,255,.18); }
  .logo.nurse img { width:100%; height:100%; object-fit:cover; display:block; }
  .nav { width:40px; height:40px; border-radius:50%; object-fit:cover; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.15); }
  .greet { display:flex; align-items:flex-end; gap:10px; margin:34px auto -18px; max-width:380px; }
  .greet .nav { width:56px; height:56px; }
  .bubble { position:relative; background:var(--glass-2); border:1px solid var(--stroke); border-radius:16px 16px 16px 4px;
            padding:10px 13px; font-size:14px; color:var(--text); line-height:1.35; }
  .nurse-load { display:flex; align-items:center; gap:12px; padding:16px; border-radius:16px; background:var(--glass); border:1px solid var(--stroke); color:var(--muted); font-size:14px; }
  .nurse-load .nav { animation:nbob 1.1s ease-in-out infinite; }
  @keyframes nbob { 0%,100% { transform:translateY(0) rotate(-4deg); } 50% { transform:translateY(-4px) rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .nurse-load .nav { animation:none; } }
  .empty .nav { width:64px; height:64px; display:block; margin:0 auto 10px; }
  .empty .rx { display:block; color:var(--text); font-weight:700; margin-bottom:4px; }
  .error.withnurse { display:flex; gap:12px; align-items:center; }
  .hint { text-align:center; color:var(--faint); font-size:13px; margin-top:40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo nurse"><img src="/nurse.jpg" alt=""></div>
      <div>
        <h1>Weather Scanner</h1>
        <div class="sub">Polymarket vs Open-Meteo</div>
      </div>
    </div>
    <button class="share" id="share" aria-label="Share this app">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      <span class="share-lbl">Share</span>
    </button>
  </header>
  <div class="toast" id="toast"></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-kind="high" role="tab">🔥 Daily high</button>
    <button class="tab" data-kind="low" role="tab">❄️ Daily low</button>
  </div>

  <div class="controls">
    <label class="toggle">
      <div><span>Include near misses</span><small>Temperature scan: forecast within 1° of an edge</small></div>
      <span class="switch"><input type="checkbox" id="near"><i></i></span>
    </label>
    <label class="toggle auto">
      <div><span>🔔 Auto-scan Edge temp <span id="autoKind">(highs)</span></span><small id="autoNote">Every 30 min · notifies this phone about new hits</small></div>
      <span class="switch"><input type="checkbox" id="auto"><i></i></span>
    </label>
    <div class="autobar" id="autobar" hidden><span id="autoLast"></span><button id="autoTest">Send test</button></div>
    <div class="toggle slider">
      <div style="flex:1"><span>Sunny day cloud limit: <b id="cloudVal">10%</b></span><small>Every daylight hour must have this much cloud or less</small>
        <input type="range" id="cloud" min="0" max="50" step="5" value="10"></div>
    </div>
    <div class="btns">
      <button class="scan" id="scan" data-mode="temp"><span class="ico">🌡️</span><span class="spinner"></span><span class="lbl">Edge temp</span></button>
      <button class="scan rain" id="rainScan" data-mode="rain"><span class="ico">🌧️</span><span class="spinner"></span><span class="lbl">Steady rain</span></button>
      <button class="scan night" id="nightScan" data-mode="night"><span class="ico" id="nightIco">🌙</span><span class="spinner"></span><span class="lbl" id="nightLbl">Night high</span></button>
      <button class="scan sun" id="sunScan" data-mode="sun"><span class="ico">☀️</span><span class="spinner"></span><span class="lbl">Sunny day</span></button>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => new Date(d + "T12:00:00Z").toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric", timeZone:"UTC" });
const NURSE = `<img class="nav" src="/nurse.jpg" alt="">`;
const NOTES = ["Clean bill of health", "All vitals normal", "Nothing to treat", "Chart looks quiet"];
const rx = () => NOTES[Math.floor(Math.random() * NOTES.length)];
const pct = v => v == null ? "?" : (v < 1 && v > 0 ? v.toFixed(1) : Math.round(v)) + "%";

// Horizontal temperature bar: low edge tick, high edge tick, forecast dot.
function bar(low, high, fc, unit) {
  const lo = low ?? (high != null ? high - 10 : fc - 5);
  const hi = high ?? (low != null ? low + 10 : fc + 5);
  const pad = Math.max(2, (hi - lo) * 0.25);
  const min = Math.min(lo - pad, fc - 1), max = Math.max(hi + pad, fc + 1);
  const x = v => Math.max(2, Math.min(98, ((v - min) / (max - min)) * 100));
  return `<div class="bar">
    ${low != null ? `<div class="tick" style="left:${x(low)}%"><em>≤${low}°</em></div>` : ""}
    ${high != null ? `<div class="tick" style="left:${x(high)}%"><em>≥${high}°</em></div>` : ""}
    <div class="dot" style="left:${x(fc)}%"></div>
  </div>`;
}

function modelBox(h) {
  if (!h.models || !h.models.length) return "";
  const n = h.models.length, a = h.agree, ratio = a / n;
  const cls = ratio >= 0.75 ? "strong" : ratio >= 0.5 ? "mixed" : "weak";
  return `<div class="models">
    <div class="mh"><span>Model check</span><span class="agree ${cls}">${a} of ${n} agree</span></div>
    ${h.models.map(m => `<div class="mr ${m.inBucket ? "in" : "out"}"><span>${esc(m.name)}</span><b>${m.value}°${h.unit} ${m.inBucket ? "✓" : "✗"}</b></div>`).join("")}
  </div>`;
}
function linkRow(h) {
  const windy = h.lat != null ? `https://www.windy.com/?${h.lat},${h.lon},10` : null;
  return `<div class="links">
    ${windy ? `<a href="${windy}" target="_blank" rel="noopener">🌬️ Windy</a>` : ""}
    ${h.settle ? `<a href="${esc(h.settle)}" target="_blank" rel="noopener">📊 Settlement data</a>` : ""}
  </div>`;
}

// Live local date & time for a city (IANA timezone from Open-Meteo)
function fmtLocal(tz) {
  try {
    const now = new Date();
    const t = new Intl.DateTimeFormat(undefined, { timeZone: tz, hour: "numeric", minute: "2-digit" }).format(now);
    const d = new Intl.DateTimeFormat(undefined, { timeZone: tz, month: "short", day: "numeric" }).format(now);
    return `${t} · ${d}`;
  } catch { return ""; }
}
const lt = tz => tz ? `<div class="lt" data-tz="${esc(tz)}">🕒 Local <span>${esc(fmtLocal(tz))}</span></div>` : "";
setInterval(() => document.querySelectorAll(".lt[data-tz]").forEach(el => { el.querySelector("span").textContent = fmtLocal(el.dataset.tz); }), 20000);

function obsLine(o, unit, extra, k = kind) {
  if (!o) return "";
  return `<div class="obs">📡<div>Observed ${k === "low" ? "low" : "high"} so far today: <b>${Math.round(o.value * 10) / 10}°${unit}</b> at ${esc(o.at)}
    <span style="color:var(--muted)">· ${o.count} airport report${o.count === 1 ? "" : "s"} (aviationweather.gov)</span>${extra ? `<br>${extra}` : ""}</div></div>`;
}

function hitCard(h, row) {
  const sign = h.past > 0 ? `${h.past}° past the line` : h.past === 0 ? "right on the line" : `${Math.abs(h.past)}° short`;
  const badge = h.locked ? `<span class="badge LOCK ${h.side}">✅ ALREADY HIT</span>`
              : h.status === "none" ? `<span class="badge nearb" style="background:rgba(255,255,255,.1);color:var(--muted)">NO HIT · ${Math.abs(h.past)}° FROM ${h.side}</span>`
              : h.nearMiss ? `<span class="badge near${h.side}">${h.side === "LOW" ? "❄︎" : "🔥"} NEAR · ${h.side}</span>`
                           : `<span class="badge ${h.side}">${h.side === "LOW" ? "❄︎ LOW EDGE" : "🔥 HIGH EDGE"}</span>`;
  const low = row?.low?.threshold ?? (h.side === "LOW" ? h.threshold : null);
  const high = row?.high?.threshold ?? (h.side === "HIGH" ? h.threshold : null);
  return `<div class="card ${h.side} ${h.nearMiss ? "near" : ""}">
    <div class="top">
      <div><div class="city">${esc(h.city)}</div><div class="date">${fmtDate(h.date)} · ${esc(h.bucket)}</div>${lt(h.tz)}</div>
      ${badge}
    </div>
    <div class="nums">
      <div class="temp"><small>${(() => { const lo = h.kind === "low", w = lo ? "low" : "high";
        const beyond = h.observed && h.forecastModel != null && (lo ? h.observed.value <= h.forecastModel : h.observed.value >= h.forecastModel);
        return beyond ? (lo ? "Low so far" : "High so far") : "Forecast " + w; })()}</small>${Math.round(h.forecast * 10) / 10}°<span style="font-size:22px">${h.unit}</span></div>
      <div class="odds"><small>Market says</small><b>${pct(h.yesPct)}</b><div class="no">No ${pct(h.noPct)}</div></div>
    </div>
    ${obsLine(h.observed, h.unit, h.locked ? "The airport has already reached this edge today."
        : h.forecastModel != null && Math.abs(h.forecastModel - h.forecast) > 0.05 ? `Already ${h.kind === "low" ? "below" : "above"} the model forecast of ${Math.round(h.forecastModel * 10) / 10}°.` : "", h.kind)}
    ${bar(low, high, h.forecast, h.unit)}
    ${modelBox(h)}
    ${h.slug ? `<button class="gbtn" data-slug="${esc(h.slug)}">📈 Day graph</button><div class="gbox"></div>` : ""}
    ${linkRow(h)}
    ${xbtn(h.slug, "temp")}
    <div class="meta">
      <div>📍 ${esc(h.station)} · ${esc(h.stationName)}<br><span style="color:var(--faint)">Rounds to ${h.rounded}°, ${sign}</span></div>
      <a href="${esc(h.url)}" target="_blank" rel="noopener">Open ↗</a>
    </div>
  </div>`;
}

function render(data) {
  const overview = data.overview || [];
  const hits = data.hits.filter(h => !h.nearMiss), near = data.hits.filter(h => h.nearMiss);
  const key = o => `${o.city}|${o.date}`;
  const rows = Object.fromEntries(overview.map(o => [key(o), o]));
  let html = `
    <div class="stats">
      <div class="stat"><b>${overview.length}</b><span>Open markets</span></div>
      <button class="stat hit tap" data-sec="sec-hits"${hits.length ? "" : " disabled"}><b>${hits.length}</b><span>Edge hits</span><small>${hits.length ? "Tap to view ›" : "None"}</small></button>
      <button class="stat near tap" data-sec="sec-near"${near.length ? "" : " disabled"}><b>${near.length}</b><span>Near misses</span><small>${near.length ? "Tap to view ›" : $("near").checked ? "None" : "Switch is off"}</small></button>
    </div>
    ${data.partial ? `<div class="when" style="color:var(--amber)">Polymarket was slow, so some markets may be missing. Try scanning again.</div>` : ""}
    <div class="when">Updated ${new Date(data.scannedAt).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })}</div>`;

  if (!data.hits.length) {
    html += `<div class="section">Results</div><div class="card empty">${NURSE}<span class="rx">${rx()}</span>No forecast is in an edge bucket right now.<br>Check the full list below to see how close each one is.</div>`;
  } else {
    // Hits and near misses stay tucked away until their tile is tapped
    html += `<div class="hsec" id="sec-hits" hidden><div class="section">Edge hits (${hits.length})</div>${hits.map(h => hitCard(h, rows[key(h)])).join("")}</div>`;
    html += `<div class="hsec" id="sec-near" hidden><div class="section">Near misses (${near.length})</div>${near.map(h => hitCard(h, rows[key(h)])).join("")}</div>`;
  }

  if (overview.length) {
    html += `<div class="section">Every market</div><details><summary>All markets (${overview.length})</summary>${overview.map(o => `
      <div class="row tap" data-slug="${esc(o.slug || "")}">
        <div class="rtop"><b>${esc(o.city)}</b><span>${fmtDate(o.date)} · ${esc(o.station)} <em class="chev">›</em></span></div>
        ${lt(o.tz)}
        ${bar(o.low?.threshold ?? null, o.high?.threshold ?? null, o.forecast, o.unit)}
        <div class="edges">
          <span style="color:var(--cold)">${o.low ? `≤${o.low.threshold}° · ${pct(o.low.yesPct)}` : "–"}</span>
          <span style="color:#fff">Forecast ${Math.round(o.forecast * 10) / 10}°${o.unit}</span>
          <span style="color:var(--hot)">${o.high ? `≥${o.high.threshold}° · ${pct(o.high.yesPct)}` : "–"}</span>
        </div>
      </div>`).join("")}</details>`;
  }

  if (data.skipped.length) {
    html += `<details style="margin-top:10px"><summary>Skipped (${data.skipped.length})</summary>${data.skipped.map(s =>
      `<div class="skip">${esc(s.title)} – ${esc(s.reason)}</div>`).join("")}</details>`;
  }
  $("out").innerHTML = html;
}

// Tap the Edge hits / Near misses tiles to show or hide their cards
document.addEventListener("click", e => {
  const t = e.target.closest(".stat.tap");
  if (!t || t.disabled) return;
  const sec = document.getElementById(t.dataset.sec);
  if (!sec) return;
  const show = sec.hidden;
  sec.hidden = !show;
  t.classList.toggle("on", show);
  t.querySelector("small").textContent = show ? "Tap to hide ‹" : "Tap to view ›";
  if (show) sec.scrollIntoView({ behavior: "smooth", block: "start" });
});

function strip(hours, start, end) {
  const h = i => String(i).padStart(2, "0") + ":00";
  return `<div class="strip">${Array.from({ length: 24 }, (_, i) => {
    const on = hours && hours[i];
    const run = on && start && h(i) >= start && h(i) <= end;
    return `<i class="${run ? "on run" : on ? "on" : ""}"></i>`;
  }).join("")}</div>`;
}

function renderRain(data) {
  const ov = data.overview || [];
  let html = `
    <div class="stats">
      <div class="stat"><b>${ov.length}</b><span>Days checked</span></div>
      <div class="stat hit"><b>${data.hits.length}</b><span>Steady rain</span></div>
      <div class="stat near"><b>${ov.filter(o => o.rainyHours > 0 && o.longest < 3).length}</b><span>Some rain</span></div>
    </div>
    ${data.partial ? `<div class="when" style="color:var(--amber)">Polymarket was slow, so some markets may be missing. Try scanning again.</div>` : ""}
    <div class="when">Rain scan · ${new Date(data.scannedAt).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })} · times are local to each city</div>
    <div class="section">Steady rain (3+ hours in a row)</div>`;
  if (!data.hits.length) html += `<div class="card empty">${NURSE}<span class="rx">${rx()}</span>No city has 3+ rainy hours in a row on any open day.</div>`;
  html += data.hits.map(h => `<div class="card RAIN">
    <div class="top">
      <div><div class="city">${esc(h.city)}</div><div class="date">${fmtDate(h.date)}</div>${lt(h.tz)}</div>
      <span class="badge RAIN">🌧 STEADY RAIN</span>
    </div>
    <div class="nums">
      <div class="temp"><small>Longest run</small>${h.longest}<span style="font-size:22px"> hrs</span></div>
      <div class="odds"><small>${esc(h.start)} – ${esc(h.end)}</small><b>${h.streakMm} mm</b><div class="no">Peak chance ${h.maxProb ?? "?"}%</div></div>
    </div>
    ${strip(h.hours, h.start, h.end)}
    <div class="strip-labels"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>
    ${xbtn(h.slug, "rain")}
    <div class="meta">
      <div>📍 ${esc(h.station)} · ${esc(h.stationName)}<br><span style="color:var(--faint)">${h.rainyHours} rainy hrs · ${h.dayMm} mm all day</span></div>
      <a href="${esc(h.url)}" target="_blank" rel="noopener">Open ↗</a>
    </div>
  </div>`).join("");
  if (ov.length) html += `<div class="section">Every day</div><details><summary>All days (${ov.length})</summary>${ov.map(o => `
    <div class="row">
      <div class="rtop"><b>${esc(o.city)}</b><span>${fmtDate(o.date)} · ${esc(o.station)}</span></div>
      ${lt(o.tz)}
      ${strip(o.hours, o.start, o.end)}
      <div class="edges" style="margin-top:4px !important"><span>${o.longest ? `Longest ${o.longest} hr${o.longest > 1 ? "s" : ""}` : "No rainy hours"}</span><span>${o.dayMm} mm</span></div>
    </div>`).join("")}</details>`;
  if (data.skipped.length) html += `<details style="margin-top:10px"><summary>Skipped (${data.skipped.length})</summary>${data.skipped.map(s =>
    `<div class="skip">${esc(s.title)} – ${esc(s.reason)}</div>`).join("")}</details>`;
  $("out").innerHTML = html;
}

function spark(temps, peakHour, k = kind) {
  const vals = temps.filter(v => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(1, hi - lo);
  return `<div class="spark">${temps.map((v, i) => {
    const night = k === "low" ? (i >= 9 && i <= 17) : (i >= 21 || i <= 5);
    const hgt = v == null ? 0 : 12 + ((v - lo) / span) * 88;
    return `<i class="${i === peakHour ? "pk" : night ? "nt" : ""}" style="height:${hgt}%"></i>`;
  }).join("")}</div>`;
}

function renderNight(data) {
  if (data.kind === "low") return renderDayLow(data);
  const ov = data.overview || [];
  const fmt = v => Math.round(v * 10) / 10;
  let html = `
    <div class="stats">
      <div class="stat"><b>${ov.length}</b><span>Days checked</span></div>
      <div class="stat hit"><b>${data.hits.length}</b><span>Night highs</span></div>
      <div class="stat near"><b>${ov.filter(o => !o.night && o.margin > -2).length}</b><span>Within 2°</span></div>
    </div>
    ${data.partial ? `<div class="when" style="color:var(--amber)">Polymarket was slow, so some markets may be missing. Try scanning again.</div>` : ""}

      <a href="${esc(h.url)}" target="_blank" rel="noopener">Open ↗</a>

  if (ov.length) html += `<div class="section">Every day</div><details><summary>All days (${ov.length})</summary>${ov.map(o => `
    <div class="row">

      <div class="edges" style="margin-top:4px !important"><span>Peak ${fmt(o.peak)}°${o.unit} at ${esc(o.peakTime)}</span><span style="color:${o.night ? "#cdb6ff" : "var(--muted)"}">${o.margin > 0 ? "+" : ""}${o.margin}° night vs day</span></div>

  if (data.skipped.length) html += `<details style="margin-top:10px"><summary>Skipped (${data.skipped.length})</summary>${data.skipped.map(s =>
    `<div class="skip">${esc(s.title)} – ${esc(s.reason)}</div>`).join("")}</details>`;
  $("out").innerHTML = html;
}

// Cloud bars: height = cloud cover. Sunny daylight hours (<=10%) are gold, night hours dimmed.
function cloudBars(clouds, daylight, limit = 10) {
  return `<div class="clouds">${clouds.map((c, i) => {
    const hgt = c == null ? 0 : Math.max(8, c);
    const cls = !daylight[i] ? "dark" : c <= limit ? "sunny" : "";
    return `<i class="${cls}" style="height:${!daylight[i] ? 8 : hgt}%"></i>`;
  }).join("")}</div>`;
}

// Hour-by-hour cloud cover, tap to expand. Night hours are dimmed; hours at/under the limit are gold.
function hourGrid(clouds, daylight, lim, open = false) {
  const lbl = i => i === 0 ? "12am" : i < 12 ? i + "am" : i === 12 ? "12pm" : (i - 12) + "pm";
  return `<details class="hours"${open ? " open" : ""}><summary>Hour by hour cloud cover</summary><div class="hgrid">${clouds.map((c, i) => {
    const cls = !daylight[i] ? "night" : c != null && c <= lim ? "sunny" : "cloudy";
    return `<div class="${cls}"><small>${lbl(i)}${!daylight[i] ? " 🌙" : ""}</small><b>${c == null ? "–" : c + "%"}</b></div>`;
  }).join("")}</div></details>`;
}

// ---------- Day graph ----------
const MODEL_COLORS = {
  ecmwf_ifs025: "#4cc9f0", gfs_seamless: "#f72585", gem_seamless: "#ffd166", icon_seamless: "#b388ff",
  ukmo_seamless: "#ff9f43", meteofrance_seamless: "#2ec4b6", jma_seamless: "#ff6b6b"
};
const shortDay = d => { const t = new Date(d + "T12:00:00Z"); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][t.getUTCDay()] + " " + t.getUTCDate(); };
const SHORT = { ecmwf_ifs025: "ECMWF", gfs_seamless: "GFS", gem_seamless: "GEM", icon_seamless: "ICON", ukmo_seamless: "UKMO", meteofrance_seamless: "Météo-Fr", jma_seamless: "JMA" };
function dayGraph(g, opt = {}) {
  const W = opt.W || 340, H = opt.H || 230, L = 34, R = 10, T = 14, B = 26;
  const models = g.models || [];
  const pts = [...g.forecast.map(p => p.v), ...g.observed.map(p => p.v), ...models.flatMap(m => m.points.map(p => p.v))];
  if (!pts.length) return `<div class="gsum">No hourly data for this day yet.</div>`;
  let lo = Math.min(...pts), hi = Math.max(...pts);
  for (const e of [g.lowEdge, g.highEdge]) if (e != null && e >= lo - 6 && e <= hi + 6) { lo = Math.min(lo, e); hi = Math.max(hi, e); }
  lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1);
  const days = g.days || 1, span = days * 1440, lastStart = (days - 1) * 1440;
  const x = m => L + (m / span) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const path = arr => arr.map((p, i) => `${i ? "L" : "M"}${x(p.m).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const now = g.nowMin, low = g.kind === "low";
  const step = (hi - lo) > 16 ? 5 : (hi - lo) > 8 ? 2 : 1;
  let grid = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="rgba(235,238,255,.5)">${v}°</text>`;
  const dayName = shortDay;
  const hrs = days === 1
    ? [[0, "12a"], [360, "6a"], [720, "12p"], [1080, "6p"], [1440, "12a"]]
        .map(([m, t]) => `<text x="${x(m)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="rgba(235,238,255,.5)">${t}</text>`).join("")
    : g.dates.map((d, i) => `
        ${i ? `<line x1="${x(i * 1440)}" x2="${x(i * 1440)}" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.16)"/>` : ""}
        <text x="${x(i * 1440 + 720)}" y="${H - 8}" text-anchor="middle" font-size="10" font-weight="${i === days - 1 ? 700 : 400}" fill="${i === days - 1 ? "#fff" : "rgba(235,238,255,.5)"}">${esc(dayName(d))}</text>`).join("")
      + `<rect x="${x(lastStart)}" y="${T}" width="${x(span) - x(lastStart)}" height="${H - T - B}" fill="rgba(255,209,102,.05)"/>`;
  const edgeLine = (v, col, lbl) => v == null || v < lo || v > hi ? "" :
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-width="1.3" stroke-dasharray="5 4" opacity=".9"/>
     <text x="${W - R - 2}" y="${y(v) - 4}" text-anchor="end" font-size="10" font-weight="700" fill="${col}">${lbl}</text>`;
  const extOf = arr => arr.reduce((a, p) => !a || (low ? p.v < a.v : p.v > a.v) ? p : a, null);
  const r1 = v => Math.round(v * 10) / 10;
  // Day's extreme: recorded readings for the past, blended forecast for the rest
  const onDay = arr => arr.filter(p => p.m >= lastStart);
  const ext = extOf(onDay([...g.observed, ...g.forecast.filter(p => now == null || p.m > now)]));
  const hhmm = m => `${days > 1 ? dayName(g.dates[Math.min(days - 1, Math.floor(m / 1440))]) + " " : ""}${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const word = low ? "low" : "high";
  // Accuracy over the complete past days: each source's daily extreme vs the airport's recorded one
  const miss = {};
  if (days > 1) {
    const recByDay = [];
    for (let i = 0; i < days - 1; i++) {
      const o = g.observed.filter(p => p.m >= i * 1440 && p.m < (i + 1) * 1440);
      recByDay.push(o.length >= 16 ? extOf(o).v : null); // need a reasonably complete day of reports
    }
    const score = (key, pts) => {
      const errs = [];
      recByDay.forEach((rec, i) => { if (rec == null) return; const d = pts.filter(p => p.m >= i * 1440 && p.m < (i + 1) * 1440); if (d.length >= 20) errs.push(Math.abs(extOf(d).v - rec)); });
      if (errs.length) miss[key] = { avg: errs.reduce((a, b) => a + b, 0) / errs.length, n: errs.length };
    };
    score("blend", g.forecast); models.forEach(m => score(m.id, m.points));
  }
  const gid = "g" + Math.random().toString(36).slice(2, 9);
  GRAPHS[gid] = { g, W, H, L, R, T, B, lo, hi, x, y, models };
  const legend = [
    ...(onDay(g.observed).length ? [{ key: "obs", name: "Airport", color: "#ffffff", val: extOf(onDay(g.observed))?.v }] : []),
    { key: "blend", name: "Blend", color: "rgba(255,255,255,.55)", val: extOf(onDay(g.forecast))?.v, dash: true, miss: miss.blend },
    ...models.map(m => ({ key: m.id, name: SHORT[m.id] || m.name, color: MODEL_COLORS[m.id] || "#aaa", val: extOf(onDay(m.points))?.v, miss: miss[m.id] }))
  ];
  const best = Object.entries(miss).sort((a, b) => a[1].avg - b[1].avg)[0];
  const gsumHtml = `<div class="gsum">${esc(g.city)} · ${days > 1 ? `${esc(dayName(g.dates[0]))} – ${fmtDate(g.date)}` : fmtDate(g.date)} · ${esc(g.station)}${ext ? ` · ${g.observed.includes(ext) ? "recorded" : "expected"} ${word} <b>${r1(ext.v)}°${g.unit}</b> at ${hhmm(ext.m)}` : ""}</div>`;
  const svgHtml = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperature graph by model" data-gid="${gid}" style="touch-action:none">
      ${grid}${hrs}
      ${edgeLine(g.lowEdge, "#5ec8ff", `≤${g.lowEdge}° edge`)}${edgeLine(g.highEdge, "#ff9f43", `≥${g.highEdge}° edge`)}
      ${now != null && now < span ? `<rect x="${L}" y="${T}" width="${Math.max(0, x(now) - L)}" height="${H - T - B}" fill="rgba(255,255,255,.035)"/>
        <line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.4)" stroke-dasharray="2 3"/>
        <text x="${x(now) + 3}" y="${T + 9}" font-size="10" fill="rgba(255,255,255,.75)">now</text>` : ""}
      ${models.map(m => `<path data-line="${m.id}" d="${path(m.points)}" fill="none" stroke="${MODEL_COLORS[m.id] || "#aaa"}" stroke-width="1.6" stroke-linejoin="round" opacity=".9"/>`).join("")}
      ${g.forecast.length > 1 ? `<path data-line="blend" d="${path(g.forecast)}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-dasharray="4 3"/>` : ""}
      <g data-line="obs">
        ${g.observed.length > 1 ? `<path d="${path(g.observed)}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="5"/><path d="${path(g.observed)}" fill="none" stroke="#fff" stroke-width="2.6"/>` : ""}
        ${g.observed.map(p => `<circle cx="${x(p.m)}" cy="${y(p.v)}" r="2.4" fill="#fff"/>`).join("")}
      </g>
      ${ext ? `<circle cx="${x(ext.m)}" cy="${y(ext.v)}" r="5.5" fill="none" stroke="#ffd166" stroke-width="2"/>` : ""}
      <g class="xh"></g>
      <rect class="hitarea" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
    </svg>`;
  const restHtml = `
    <div class="readout">Tap or drag on the graph to read temperatures by hour.</div>
    <div class="glh">${days > 1 ? `${esc(dayName(g.date))} ${word} by source · ±° = avg miss vs airport, past days` : `Day's ${word} by source${g.observed.length ? " · Airport = recorded so far" : ""}`}</div>
    <div class="gleg2">${legend.map(l => `
      <button class="li" data-key="${l.key}"><i style="background:${l.color}${l.dash ? ";background-image:repeating-linear-gradient(90deg,transparent 0 3px,#14162b 3px 5px)" : ""}"></i>
        <span>${esc(l.name)}${l.miss ? `<small class="miss${best && best[0] === l.key ? " best" : ""}">${best && best[0] === l.key ? "★ " : ""}±${l.miss.avg.toFixed(1)}°<span class="mw"> miss</span></small>` : ""}</span><b>${l.val != null ? `${r1(l.val)}°` : ""}</b></button>`).join("")}
    </div>
    <div class="gtip">Tap a name to highlight its line. Shaded area = hours already passed.</div>
    <button class="grange" data-days="${days > 1 ? 1 : 4}">${days > 1 ? "📅 Show just this day" : "🗓️ Show past 3 days"}</button>
    ${days > 1 && best ? `<div class="gtip">Most accurate here over the past days: <b style="color:${colorOf(best[0])}">${esc(best[0] === "blend" ? "Blend" : SHORT[best[0]] || best[0])}</b> (±${best[1].avg.toFixed(1)}° on the daily ${word}). Past hours use each model's latest run, so real multi-day forecasts miss by more.</div>` : ""}`;
  if (opt.fs) return `
    <div class="fsl">
      <div class="fsc">${gsumHtml}${svgHtml}</div>
      <div class="fsp">${restHtml}</div>
    </div>`;
  return `<button class="gexp" aria-label="Expand graph">⤢ Expand</button>${gsumHtml}${svgHtml}${restHtml}`;
}

// ---------- Interactive graph: highlight a source, read values by hour ----------
const GRAPHS = {};
const LABEL = { obs: "Airport", blend: "Blend" };
function seriesOf(G, key) {
  if (key === "obs") return G.g.observed;
  if (key === "blend") return G.g.forecast;
  return (G.models.find(m => m.id === key) || {}).points || [];
}
function colorOf(key) { return key === "obs" ? "#ffffff" : key === "blend" ? "rgba(255,255,255,.75)" : MODEL_COLORS[key] || "#aaa"; }
function valueAt(G, key, minute) {
  const pts = seriesOf(G, key);
  if (!pts.length) return null;
  if (key === "obs") { // nearest airport reading within 45 min
    const p = pts.reduce((a, q) => !a || Math.abs(q.m - minute) < Math.abs(a.m - minute) ? q : a, null);
    return p && Math.abs(p.m - minute) <= 45 ? p : null;
  }
  return pts.find(q => q.m === minute) || null;
}
function applyHighlight(box) {
  const sel = box.dataset.sel || "";
  box.querySelectorAll("[data-line]").forEach(el => {
    const k = el.getAttribute("data-line");
    el.style.opacity = !sel || k === sel ? "" : ".12";
    if (el.tagName === "path") el.setAttribute("stroke-width", sel && k === sel ? "3.4" : (k === "blend" ? "1.6" : "1.6"));
  });
  box.querySelectorAll(".gleg2 .li").forEach(li => li.classList.toggle("sel", li.dataset.key === sel));
  box.querySelectorAll(".gleg2 .li").forEach(li => li.classList.toggle("dim", !!sel && li.dataset.key !== sel));
  if (box.dataset.min) drawCrosshair(box, +box.dataset.min);
}
function drawCrosshair(box, minute) {
  const svg = box.querySelector("svg[data-gid]"); if (!svg) return;
  const G = GRAPHS[svg.dataset.gid]; if (!G) return;
  const { x, y, T, H, B, g } = G;
  const unit = "°" + g.unit, r1 = v => Math.round(v * 10) / 10;
  const sel = box.dataset.sel || "";
  const keys = sel ? [sel] : [...(g.observed.length ? ["obs"] : []), "blend", ...G.models.map(m => m.id)];
  const dn = shortDay;
  const hhmm = m => `${(g.days || 1) > 1 ? dn(g.dates[Math.min(g.days - 1, Math.floor(m / 1440))]) + " " : ""}${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  let dots = "", rows = [];
  for (const k of keys) {
    const p = valueAt(G, k, minute);
    if (!p) continue;
    dots += `<circle cx="${x(p.m)}" cy="${y(p.v)}" r="${sel ? 5 : 3.2}" fill="${colorOf(k)}" stroke="#14162b" stroke-width="1.5"/>`;
    rows.push({ k, p });
  }
  box.querySelector(".xh").innerHTML = `<line x1="${x(minute)}" x2="${x(minute)}" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.6)" stroke-width="1"/>${dots}`;
  const name = k => LABEL[k] || SHORT[k] || k;
  const ro = box.querySelector(".readout");
  if (sel) {
    const r = rows[0];
    ro.innerHTML = r
      ? `<span class="rdot" style="background:${colorOf(sel)}"></span><b>${esc(name(sel))}</b> at <b>${hhmm(sel === "obs" ? r.p.m : minute)}</b>: <span class="rbig">${r1(r.p.v)}${unit}</span>`
      : `<b>${esc(name(sel))}</b> has no value at ${hhmm(minute)}${sel === "obs" ? " (no airport report near this time yet)" : ""}`;
  } else {
    rows.sort((a, b) => b.p.v - a.p.v);
    ro.innerHTML = `<div class="rhead">${hhmm(minute)} local</div><div class="rgrid">${rows.map(r =>
      `<span><span class="rdot" style="background:${colorOf(r.k)}"></span>${esc(name(r.k))}${r.k === "obs" ? ` <small>(${hhmm(r.p.m)})</small>` : ""}</span><b>${r1(r.p.v)}${unit}</b>`).join("")}</div>`;
  }
  box.dataset.min = minute;
}
function pointerToMinute(svg, clientX, clientY) {
  const G = GRAPHS[svg.dataset.gid];
  const rect = svg.getBoundingClientRect();
  const rotated = !!svg.closest(".fs.rot");
  // When the full-screen view is drawn sideways, the chart's x-axis runs top → bottom on screen
  const sx = rotated ? (clientY - rect.top) / rect.height * G.W : (clientX - rect.left) / rect.width * G.W;
  const frac = Math.min(1, Math.max(0, (sx - G.L) / (G.W - G.L - G.R)));
  const days = G.g.days || 1;
  return Math.min(24 * days - 1, Math.round(frac * 24 * days)) * 60;
}
// ---------- Full-screen (sideways) graph ----------
function fsSize() {
  const vw = innerWidth, vh = innerHeight, rot = vh > vw;      // portrait → draw it sideways
  const long = Math.max(vw, vh), short = Math.min(vw, vh);
  const panel = Math.min(260, Math.round(long * 0.34));
  const cw = long - panel - 40, ch = short - 70;               // chart area in landscape terms
  return { rot, long, short, W: 640, H: Math.max(220, Math.round(640 * ch / cw)) };
}
function renderFS(box) {
  const fs = box.closest(".fs"), z = fsSize();
  fs.classList.toggle("rot", z.rot);
  box.style.width = z.long + "px"; box.style.height = z.short + "px";
  box.innerHTML = `<button class="fsx" aria-label="Close">✕</button>` + dayGraph(box._g, { fs: true, W: z.W, H: z.H });
  applyHighlight(box);
}
function openFS(src) {
  const fs = document.createElement("div");
  fs.className = "fs";
  fs.innerHTML = `<div class="gbox fsbox"></div>`;
  const box = fs.firstChild;
  box._g = src._g; box.dataset.slug = src.dataset.slug; box.dataset.sel = src.dataset.sel || "";
  if (src.dataset.min) box.dataset.min = src.dataset.min;
  document.body.appendChild(fs);
  document.body.classList.add("fs-open");
  renderFS(box);
  const onResize = () => { if (document.body.contains(fs)) renderFS(box); else removeEventListener("resize", onResize); };
  addEventListener("resize", onResize);
}
document.addEventListener("click", e => {
  const ex = e.target.closest(".gexp");
  if (ex) { const box = ex.closest(".gbox"); if (box && box._g) openFS(box); return; }
  const x = e.target.closest(".fsx");
  if (x) { x.closest(".fs").remove(); document.body.classList.remove("fs-open"); }
});

// Range button: past 3 days + market day, or just the market day
document.addEventListener("click", async e => {
  const b = e.target.closest(".grange");
  if (!b) return;
  const box = b.closest(".gbox"), slug = box.dataset.slug, days = b.dataset.days;
  b.disabled = true; b.textContent = days > 1 ? "Loading past days…" : "Loading…";
  try {
    const r = await fetch(`/api/scan?mode=graph&slug=${encodeURIComponent(slug)}&days=${days}&t=${Date.now()}`);
    const body = await r.text();
    let g; try { g = JSON.parse(body); } catch { throw new Error(`Server returned ${r.status}`); }
    if (g.error) throw new Error(g.error);
    delete box.dataset.min;
    box._g = g;
    if (box.classList.contains("fsbox")) renderFS(box); else box.innerHTML = dayGraph(g);
    applyHighlight(box);
  } catch (err) {
    b.disabled = false; b.textContent = "Couldn't load: " + err.message;
  }
});

// Legend: tap to highlight one source (tap again to clear)
document.addEventListener("click", e => {
  const li = e.target.closest(".gleg2 .li");
  if (!li) return;
  const box = li.closest(".gbox");
  box.dataset.sel = box.dataset.sel === li.dataset.key ? "" : li.dataset.key;
  if (!box.dataset.min) {
    const svg = box.querySelector("svg[data-gid]"); const G = svg && GRAPHS[svg.dataset.gid];
    const span = G ? (G.g.days || 1) * 1440 : 1440;
    box.dataset.min = G && G.g.nowMin != null && G.g.nowMin < span ? Math.min(span / 60 - 1, Math.round(G.g.nowMin / 60)) * 60 : span - 720;
  }
  applyHighlight(box);
});
// Chart: tap or drag to move the crosshair
document.addEventListener("pointerdown", e => {
  const svg = e.target.closest && e.target.closest("svg[data-gid]");
  if (!svg) return;
  const box = svg.closest(".gbox");
  const move = ev => drawCrosshair(box, pointerToMinute(svg, ev.clientX, ev.clientY));
  move(e);
  try { svg.setPointerCapture(e.pointerId); } catch {}
  const up = () => { svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up); svg.removeEventListener("pointercancel", up); };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerup", up);
  svg.addEventListener("pointercancel", up);
});

document.addEventListener("click", async e => {
  const b = e.target.closest(".gbtn");
  if (!b) return;
  const box = b.nextElementSibling;
  if (b.classList.contains("open")) { b.classList.remove("open"); box.innerHTML = ""; b.textContent = "📈 Day graph"; return; }
  b.classList.add("open"); b.textContent = "Loading graph…";
  try {
    const r = await fetch(`/api/scan?mode=graph&slug=${encodeURIComponent(b.dataset.slug)}&t=${Date.now()}`);
    const body = await r.text();
    let g; try { g = JSON.parse(body); } catch { throw new Error(`Server returned ${r.status}`); }
    if (g.error) throw new Error(g.error);
    box.dataset.slug = b.dataset.slug;
    box._g = g;
    box.innerHTML = dayGraph(g);
    applyHighlight(box);
    b.textContent = "📈 Hide graph";
  } catch (err) {
    box.innerHTML = `<div class="error">Couldn't load graph: ${esc(err.message)}</div>`;
    b.textContent = "📈 Day graph"; b.classList.remove("open");
  }
});

// ---------- Tap an "All markets" row to open its full card ----------
document.addEventListener("click", async e => {
  const row = e.target.closest(".row.tap");
  if (!row || e.target.closest(".detail")) return;
  const slug = row.dataset.slug;
  if (!slug) return;
  const open = row.querySelector(".detail");
  if (open) { open.remove(); row.classList.remove("open"); return; }
  row.classList.add("open");
  const box = document.createElement("div");
  box.className = "detail";
  box.innerHTML = `<div class="loading"><span class="spinner" style="display:inline-block;vertical-align:middle"></span> Loading details…</div>`;
  row.appendChild(box);
  try {
    const near = $("near").checked ? 1 : 0;
    const r = await fetch(`/api/scan?mode=detail&slug=${encodeURIComponent(slug)}&near=${near}&t=${Date.now()}`);
    const body = await r.text();
    let data; try { data = JSON.parse(body); } catch { throw new Error(`Server returned ${r.status}`); }
    if (data.error) throw new Error(data.error);
    box.innerHTML = hitCard(data.hit, data.row);
  } catch (err) {
    box.innerHTML = `<div class="error">Couldn't load details: ${esc(err.message)}</div>`;
  }
});

// ---------- Cross-check one hit against the other scans ----------
const SCANS = { temp: ["🌡️", "Edge temp"], rain: ["🌧️", "Steady rain"], night: ["🌙", "Night high"], sun: ["☀️", "Sunny day"] };
const xbtn = (slug, mode) => slug ? `<button class="xcheck" data-slug="${esc(slug)}" data-mode="${mode}"><span class="spinner"></span><span class="xl">🔍 Check other scans</span></button><div class="xres"></div>` : "";
const PILL = { pass: "PASS", fail: "FAIL", near: "NEAR", na: "N/A" };

document.addEventListener("click", async e => {
  const b = e.target.closest(".xcheck");
  if (!b || b.disabled) return;
  const box = b.nextElementSibling, from = b.dataset.mode;
  b.disabled = true; b.classList.add("busy"); b.querySelector(".xl").textContent = "Checking…";
  try {
    const near = $("near").checked ? 1 : 0;
    const r = await fetch(`/api/scan?mode=check&slug=${encodeURIComponent(b.dataset.slug)}&near=${near}&cloud=${$("cloud").value}&t=${Date.now()}`);
    const body = await r.text();
    let data; try { data = JSON.parse(body); } catch { throw new Error(`Server returned ${r.status}`); }
    if (data.error) throw new Error(data.error);
    const others = Object.keys(SCANS).filter(k => k !== from);
    const passes = others.filter(k => data.checks[k]?.status === "pass").length;
    box.innerHTML = others.map(k => {
      const c = data.checks[k] || { status: "na", detail: "" };
      return `<div class="xr ${c.status}"><div class="ic">${SCANS[k][0]}</div><div>
        <div class="nm">${SCANS[k][1]} <span class="pill ${c.status}">${c.status === "pass" ? "✅ " : c.status === "fail" ? "❌ " : ""}${PILL[c.status] || c.status}</span></div>
        <div class="dt">${esc(c.detail)}</div></div></div>`;
    }).join("");
    b.querySelector(".xl").textContent = `🔍 ${passes} of ${others.length} other scans pass`;
  } catch (err) {
    box.innerHTML = `<div class="error">Check failed: ${esc(err.message)}</div>`;
    b.querySelector(".xl").textContent = "🔍 Check other scans";
  }
  b.disabled = false; b.classList.remove("busy");
});

function renderDayLow(data) {
  const ov = data.overview || [];
  const fmt = v => Math.round(v * 10) / 10;
  let html = `
    <div class="stats">
      <div class="stat"><b>${ov.length}</b><span>Days checked</span></div>
      <div class="stat hit"><b>${data.hits.length}</b><span>Day lows</span></div>
      <div class="stat near"><b>${ov.filter(o => !o.night && o.margin > -2).length}</b><span>Within 2°</span></div>
    </div>
    ${data.partial ? `<div class="when" style="color:var(--amber)">Polymarket was slow, so some markets may be missing. Try scanning again.</div>` : ""}
    <div class="when">Day low scan · ${new Date(data.scannedAt).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })} · times are local to each city</div>
    <div class="section">Low comes in the daytime (9am–5pm)</div>`;
  if (!data.hits.length) html += `<div class="card empty">${NURSE}<span class="rx">${rx()}</span>Every open day bottoms out overnight right now.</div>`;
  html += data.hits.map(h => `<div class="card NIGHT">
    <div class="top">
      <div><div class="city">${esc(h.city)}</div><div class="date">${fmtDate(h.date)}</div>${lt(h.tz)}</div>
      <span class="badge NIGHT">🌤️ DAY LOW</span>
    </div>
    <div class="nums">
      <div class="temp"><small>Low at ${esc(h.peakTime)}</small>${fmt(h.peak)}°<span style="font-size:22px">${h.unit}</span></div>
      <div class="odds"><small>Other hours' low ${fmt(h.dayMax)}° at ${esc(h.dayTime)}</small><b>−${h.margin}°</b><div class="no">colder in the daytime</div></div>
    </div>
    ${obsLine(h.observed, h.unit, h.locked ? "The low shown has already been recorded; past hours use real airport readings." : "Past hours use real airport readings; later hours use the forecast.", "low")}
    ${spark(h.temps, +h.peakTime.slice(0, 2), "low")}
    <div class="strip-labels"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>
    ${xbtn(h.slug, "night")}
    <div class="meta">
      <div>📍 ${esc(h.station)} · ${esc(h.stationName)}<br><span style="color:var(--faint)">${h.leading ? `Market favours ${esc(h.leading.label)} at ${pct(h.leading.yesPct)}` : ""}</span></div>
      <a href="${esc(h.url)}" target="_blank" rel="noopener">Open ↗</a>
    </div>
  </div>`).join("");
  if (ov.length) html += `<div class="section">Every day</div><details><summary>All days (${ov.length})</summary>${ov.map(o => `
    <div class="row">
      <div class="rtop"><b>${esc(o.city)}</b><span>${fmtDate(o.date)} · ${esc(o.station)}</span></div>
      ${lt(o.tz)}
      ${spark(o.temps, +o.peakTime.slice(0, 2), "low")}
      <div class="edges" style="margin-top:4px !important"><span>Low ${fmt(o.peak)}°${o.unit} at ${esc(o.peakTime)}</span><span style="color:${o.night ? "#cdb6ff" : "var(--muted)"}">${o.margin > 0 ? `${o.margin}° colder by day` : `${Math.abs(o.margin)}° colder at night`}</span></div>
    </div>`).join("")}</details>`;
  if (data.skipped.length) html += `<details style="margin-top:10px"><summary>Skipped (${data.skipped.length})</summary>${data.skipped.map(s =>
    `<div class="skip">${esc(s.title)} – ${esc(s.reason)}</div>`).join("")}</details>`;
  $("out").innerHTML = html;
}

// ---------- Tabs: Daily high / Daily low ----------
let kind = "high";
try { if (localStorage.getItem("kind") === "low") kind = "low"; } catch {}
function hint() {
  return `<div class="greet">${NURSE}<div class="bubble">Hi! Pick a scan and I'll check the forecast's vitals.</div></div>` + (kind === "low"
    ? `<p class="hint"><b>Edge temp</b>: forecast lows that land in an edge bucket.<br><b>Steady rain</b>: 3+ hours in a row with ≥50% chance and ≥0.1 mm.<br><b>Day low</b>: the day's low comes between 9am and 5pm.<br><b>Sunny day</b>: every daylight hour under your cloud limit, no rain.<br>All scans use every city and day with a daily low market on Polymarket.</p>`
    : `<p class="hint"><b>Edge temp</b>: forecast highs that land in an edge bucket.<br><b>Steady rain</b>: 3+ hours in a row with ≥50% chance and ≥0.1 mm.<br><b>Night high</b>: the day's high comes between 9pm and 5am.<br><b>Sunny day</b>: every daylight hour under your cloud limit, no rain.<br>All scans use every city and day with a daily high market on Polymarket.</p>`);
}
function setKind(k, keepResults) {
  kind = k;
  try { localStorage.setItem("kind", k); } catch {}
  document.body.classList.toggle("low", k === "low");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.kind === k));
  $("nightLbl").textContent = k === "low" ? "Day low" : "Night high";
  $("nightIco").textContent = k === "low" ? "🌤️" : "🌙";
  SCANS.night = k === "low" ? ["🌤️", "Day low"] : ["🌙", "Night high"];
  $("autoKind").textContent = k === "low" ? "(lows)" : "(highs)";
  if (!keepResults) $("out").innerHTML = hint();
  if (typeof syncAutoToggle === "function") syncAutoToggle();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { if (t.dataset.kind !== kind) setKind(t.dataset.kind); });

async function runScan(btn) {
  const mode = btn.dataset.mode;
  document.querySelectorAll(".scan").forEach(b => b.disabled = true);
  btn.classList.add("busy");
  const lbl = btn.querySelector(".lbl"), orig = lbl.textContent;
  lbl.textContent = "Scanning…";
  $("out").innerHTML = `<div class="nurse-load">${NURSE}<span>Taking the forecast's temperature…</span></div>`;
  try {
    const near = $("near").checked ? 1 : 0;
    const r = await fetch(`/api/scan?mode=${mode}&kind=${kind}&near=${near}&cloud=${$("cloud").value}&t=${Date.now()}`);
    const body = await r.text();
    let data;
    try { data = JSON.parse(body); }
    catch { throw new Error(`Server returned ${r.status}${r.status === 504 ? " (scan timed out)" : ""}: ${body.slice(0, 120)}`); }
    if (data.error) throw new Error(data.error);
    mode === "rain" ? renderRain(data) : mode === "night" ? renderNight(data) : mode === "sun" ? renderSun(data) : render(data);
  } catch (e) {
    $("out").innerHTML = `<div class="error withnurse">${NURSE}<div><b>Hmm, that scan didn't go well.</b><br>${esc(e.message)}</div></div>`;
  }
  document.querySelectorAll(".scan").forEach(b => b.disabled = false);
  btn.classList.remove("busy"); lbl.textContent = orig;
}
// ---------- Auto-scan notifications ----------
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const keyBytes = k => { const b = atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const postJSON = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
  .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok || j.error) throw new Error(j.error || `Error ${r.status}`); return j; });
const setNote = (msg, warn) => { $("autoNote").textContent = msg; $("autoNote").style.color = warn ? "var(--amber)" : ""; };
const defaultNote = "Every 30 min · notifies this phone about new hits";

// Which tabs this phone wants alerts for: { high, low }
function getKinds() { try { return JSON.parse(localStorage.getItem("autoKinds")) || { high: true, low: false }; } catch { return { high: true, low: false }; } }
function setKinds(k) { try { localStorage.setItem("autoKinds", JSON.stringify(k)); } catch {} }
let subscribed = false;
function syncAutoToggle() { $("auto").checked = subscribed && !!getKinds()[kind]; showAutoStatus(); }

async function showAutoStatus() {
  $("autobar").hidden = !$("auto").checked;
  if (!$("auto").checked) return;
  try {
    const j = await fetch("/api/push?action=status&t=" + Date.now()).then(r => r.json());
    $("autoLast").textContent = j.lastRun ? `Last auto-scan ${new Date(j.lastRun.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · ${j.lastRun.hits} hit${j.lastRun.hits === 1 ? "" : "s"}` : "Waiting for the first auto-scan…";
  } catch { $("autoLast").textContent = ""; }
}

async function enableAuto() {
  if (!pushOK) {
    throw new Error(isIOS && !standalone ? "Open Weather Scanner from your home screen icon to turn on notifications"
                                         : "This browser can't receive notifications");
  }
  const perm = await Notification.requestPermission(); // must come first, straight from the tap
  if (perm !== "granted") throw new Error("Notifications are blocked. Allow them in Settings → Notifications → Weather Scanner");
  const reg = await navigator.serviceWorker.ready;
  const { publicKey, error } = await fetch("/api/push?action=key").then(r => r.json());
  if (error) throw new Error(error);
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
  await postJSON("/api/push?action=subscribe", { subscription: sub.toJSON(), near: $("near").checked, kinds: getKinds() });
  subscribed = true;
}

async function disableAuto() {
  if (!pushOK) return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub) { await postJSON("/api/push?action=unsubscribe", { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe().catch(() => {}); }
  subscribed = false;
}

$("auto").onchange = async e => {
  const on = e.target.checked;
  e.target.disabled = true; setNote(on ? "Turning on…" : "Turning off…");
  try {
    const prev = getKinds();
    const next = { ...prev, [kind]: on };
    setKinds(next);
    if (on) { await enableAuto(); setNote(defaultNote); toast(`Auto-scan on for daily ${kind}s 🔔`); }
    else if (!next.high && !next.low) { await disableAuto(); setNote(defaultNote); }
    else { await enableAuto(); setNote(defaultNote); } // still on for the other tab
  } catch (err) {
    e.target.checked = false; setNote(err.message, true);
    setKinds({ ...getKinds(), [kind]: false });
  }
  e.target.disabled = false; showAutoStatus();
};

$("autoTest").onclick = async () => {
  try {
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (!sub) throw new Error("Not subscribed");
    await postJSON("/api/push?action=test", { endpoint: sub.endpoint });
    toast("Test sent, check your notifications");
  } catch (err) { toast("Test failed: " + err.message); }
};

// Keep the near-miss preference in sync for auto-scan alerts
$("near").addEventListener("change", async () => {
  if (!subscribed || !pushOK) return;
  const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
  if (sub) postJSON("/api/push?action=subscribe", { subscription: sub.toJSON(), near: $("near").checked, kinds: getKinds() }).catch(() => {});
});

// On load: reflect whether this phone is subscribed
(async () => {
  if (!pushOK) return;
  try {
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    subscribed = !!sub && Notification.permission === "granted";
    // Older sign-ups were highs only: register the current preference with the server once
    if (subscribed && !localStorage.getItem("autoKinds")) {
      setKinds({ high: true, low: false });
      postJSON("/api/push?action=subscribe", { subscription: sub.toJSON(), near: $("near").checked, kinds: getKinds() }).catch(() => {});
    }
  } catch {}
  syncAutoToggle();
})();

$("scan").onclick = () => runScan($("scan"));
$("rainScan").onclick = () => runScan($("rainScan"));
$("nightScan").onclick = () => runScan($("nightScan"));
$("sunScan").onclick = () => runScan($("sunScan"));

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}
$("share").onclick = async () => {
  const url = location.origin + "/";
  const text = "Weather Scanner: compares Polymarket weather markets with Open-Meteo forecasts. Open in Safari, then Share → Add to Home Screen.";
  if (navigator.share) {
    try { await navigator.share({ title: "Weather Scanner", text, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Link copied"); }
  catch { toast(url); }
};

function syncCloud() {
  const v = $("cloud").value;
  $("cloudVal").textContent = v + "%";
  $("cloud").style.setProperty("--fill", (v / 50 * 100) + "%");
}
try { const c = localStorage.getItem("cloud"); if (c != null) $("cloud").value = c; } catch {}
syncCloud();
$("cloud").oninput = () => { syncCloud(); try { localStorage.setItem("cloud", $("cloud").value); } catch {} };

try { const v = localStorage.getItem("near"); if (v) $("near").checked = v === "1"; } catch {}
$("near").onchange = e => { try { localStorage.setItem("near", e.target.checked ? "1" : "0"); } catch {} };

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// Opened from a notification → run the Edge temp scan straight away
// Start on the last-used tab (or the one a notification points to)
const qs = new URLSearchParams(location.search);
setKind(qs.get("kind") === "low" ? "low" : qs.get("scan") === "temp" ? "high" : kind);

// Opened from a notification → run the Edge temp scan straight away
if (qs.get("scan") === "temp") {
  history.replaceState(null, "", "/");
  runScan($("scan"));
}
</script>
